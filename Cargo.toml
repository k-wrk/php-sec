[package]
name = "php-sec"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
# TUI & Terminal
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"

# SSH
ssh2 = "0.9"

# Config & Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

# Utilities
anyhow = "1.0"
chrono = "0.4"
dirs = "5.0"
rpassword = "7.3"
